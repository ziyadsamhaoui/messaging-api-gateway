server:
  port: 8080
  netty:
    connection-timeout: 3s

spring:
  application:
    name: messaging-api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 100ms
  cloud:
    gateway:
      server:
        webflux:
          fail-on-route-definition-error: true
          httpclient:
            connect-timeout: 3000
            response-timeout: 3s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            # Retry strictly idempotent reads like: 'methods: GET'
            # keeps non-idempotent like: 'methods: POST' out of the retry path, and 429 is not retried either.
            - name: Retry
              args:
                retries: 1
                methods: GET
                series: SERVER_ERROR
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            - name: CircuitBreaker
              args:
                name: backendCircuitBreaker
                fallbackUri: forward:/fallback
          routes:
            # Public auth surface
            - id: auth-public
              uri: ${UPSTREAM_AUTH_SERVICE:http://auth-service:8081}
              predicates:
                - Path=/auth/register,/auth/login,/auth/forgot-password,/auth/reset-password
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
            - id: auth-refresh
              uri: ${UPSTREAM_AUTH_SERVICE:http://auth-service:8081}
              predicates:
                - Path=/auth/refresh
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 10
            # Authenticated auth surface
            - id: auth-authenticated
              uri: ${UPSTREAM_AUTH_SERVICE:http://auth-service:8081}
              predicates:
                - Path=/auth/logout
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
            # User service
            - id: user-service
              uri: ${UPSTREAM_USER_SERVICE:http://user-service:8082}
              predicates:
                - Path=/users/**,/connections/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
            # Chat service: reads first, then message send, then remaining writes
            - id: chat-service-reads
              uri: ${UPSTREAM_CHAT_SERVICE:http://chat-service:8083}
              predicates:
                - Path=/rooms/**,/invitations/**
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
            - id: chat-service-message-send
              uri: ${UPSTREAM_CHAT_SERVICE:http://chat-service:8083}
              predicates:
                - Path=/rooms/*/messages
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
            - id: chat-service-writes
              uri: ${UPSTREAM_CHAT_SERVICE:http://chat-service:8083}
              predicates:
                - Path=/rooms/**,/invitations/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
            # Realtime gateway: WebSocket/STOMP proxy
            - id: realtime-ws
              uri: ${UPSTREAM_REALTIME_GATEWAY:ws://realtime-gateway:8084}
              predicates:
                - Path=/ws/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3



management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}
    description: BadrLink edge API gateway (reactive routing, edge JWT verification, token bucket rate limiting)

badrlink:
  gateway:
    security:
      # Paths served without an access token. Everything else requires a valid JWT.
      public-paths:
        - /auth/register
        - /auth/login
        - /auth/refresh
        - /auth/forgot-password
        - /auth/reset-password
        - /health
        - /actuator/health
        - /actuator/health/**
        - /fallback
      internal-path-segment: internal
      internal-token-header: X-Internal-Token
      jwt:
        jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:8081/oauth2/jwks}
        issuer: ${AUTH_ISSUER:http://auth-service:8081}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,Accept,X-Requested-With,X-Correlation-Id
      exposed-headers: X-RateLimit-Remaining,X-RateLimit-Burst-Capacity,X-RateLimit-Replenish-Rate,X-RateLimit-Requested-Tokens,X-Correlation-Id
      max-age: 3600s
