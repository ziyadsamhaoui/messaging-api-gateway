server:
  port: 8080
  netty:
    connection-timeout: 3s
spring:
  application:
    name: messaging-api-gateway
  config:
    import: "optional:file:.env[.properties]"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 100ms
  cloud:
    gateway:
      server:
        webflux:
          fail-on-route-definition-error: true
          httpclient:
            connect-timeout: 3000
            response-timeout: 3s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - name: Retry
              args:
                retries: 1
                methods: GET
                series: SERVER_ERROR
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          routes:
            - id: auth-public
              uri: ${UPSTREAM_AUTH_SERVICE:http://localhost:8081}
              predicates:
                - Path=/auth/register,/auth/login,/auth/forgot-password,/auth/reset-password
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                - name: CircuitBreaker
                  args:
                    name: backendCircuitBreaker
                    fallbackUri: forward:/fallback
            - id: auth-refresh
              uri: ${UPSTREAM_AUTH_SERVICE:http://localhost:8081}
              predicates:
                - Path=/auth/refresh
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 10
                - name: CircuitBreaker
                  args:
                    name: backendCircuitBreaker
                    fallbackUri: forward:/fallback
            - id: auth-authenticated
              uri: ${UPSTREAM_AUTH_SERVICE:http://localhost:8081}
              predicates:
                - Path=/auth/logout
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                - name: CircuitBreaker
                  args:
                    name: backendCircuitBreaker
                    fallbackUri: forward:/fallback
            - id: user-service
              uri: ${UPSTREAM_USER_SERVICE:http://localhost:8082}
              predicates:
                - Path=/users/**,/connections/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - name: CircuitBreaker
                  args:
                    name: backendCircuitBreaker
                    fallbackUri: forward:/fallback
            - id: chat-service-reads
              uri: ${UPSTREAM_CHAT_SERVICE:http://localhost:8083}
              predicates:
                - Path=/rooms/**,/invitations/**
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                - name: CircuitBreaker
                  args:
                    name: backendCircuitBreaker
                    fallbackUri: forward:/fallback
            - id: chat-service-message-send
              uri: ${UPSTREAM_CHAT_SERVICE:http://localhost:8083}
              predicates:
                - Path=/rooms/*/messages
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                - name: CircuitBreaker
                  args:
                    name: backendCircuitBreaker
                    fallbackUri: forward:/fallback
            - id: chat-service-writes
              uri: ${UPSTREAM_CHAT_SERVICE:http://localhost:8083}
              predicates:
                - Path=/rooms/**,/invitations/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - name: CircuitBreaker
                  args:
                    name: backendCircuitBreaker
                    fallbackUri: forward:/fallback
            - id: attachment-service
              uri: ${UPSTREAM_ATTACHMENT_SERVICE:http://localhost:8086}
              predicates:
                - Path=/attachments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - name: CircuitBreaker
                  args:
                    name: backendCircuitBreaker
                    fallbackUri: forward:/fallback
            - id: realtime-ws
              uri: ${UPSTREAM_REALTIME_GATEWAY:http://localhost:8084}
              predicates:
                - Path=/ws/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
            - id: notification-service
              uri: ${UPSTREAM_NOTIFICATION_SERVICE:http://localhost:8085}
              predicates:
                - Path=/notifications/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - name: CircuitBreaker
                  args:
                    name: backendCircuitBreaker
                    fallbackUri: forward:/fallback
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 80
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      backendCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}
    description: BadrLink edge API gateway (reactive routing, edge JWT verification, token bucket rate limiting)

badrlink:
  gateway:
    security:
      public-paths:
        - /auth/register
        - /auth/login
        - /auth/refresh
        - /auth/forgot-password
        - /auth/reset-password
        - /health
        - /actuator/health
        - /actuator/health/**
        - /fallback
      internal-path-segment: internal
      internal-token-header: X-Internal-Token
      jwt:
        jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
        issuer: ${AUTH_ISSUER:http://localhost:8081}
        audience: ${AUTH_AUDIENCE:messaging-api}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,Accept,X-Requested-With,X-Correlation-Id
      exposed-headers: X-RateLimit-Remaining,X-RateLimit-Burst-Capacity,X-RateLimit-Replenish-Rate,X-RateLimit-Requested-Tokens,X-Correlation-Id
      max-age: 3600s

logging:
  level:
    root: INFO
    com.ziyadsamhaoui.messagingapigateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    reactor.netty: WARN
    org.springframework.data.redis: WARN
